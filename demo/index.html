<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pdfni demo</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #e2e2dd;
    --border-strong: #cfcfc8;
    --text: #1f1f1c;
    --muted: #7a7a72;
    --accent: #2f6f6a;
    --accent-soft: #e6f0ef;
    --danger: #b3402f;
    --radius: 8px;
    --mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 26px;
  }
  .page-title {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .gh-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    transition: color .15s;
  }
  .gh-link:hover { color: var(--accent); }
  .gh-link svg { width: 16px; height: 16px; fill: currentColor; }

  .field { margin-bottom: 22px; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .dropzone {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 26px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover { border-color: var(--accent); }
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone.has-file {
    border-style: solid;
    text-align: left;
  }
  .dropzone.has-file:hover { border-color: var(--border-strong); }
  .dropzone.disabled {
    opacity: .5;
    pointer-events: none;
  }
  .dz-file {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .file-name {
    font-family: var(--mono);
    font-size: 13px;
    word-break: break-all;
  }
  .file-size { color: var(--muted); font-size: 12px; }
  .remove-btn {
    flex: none;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .remove-btn:hover { color: var(--danger); border-color: var(--danger); }

  input[type="password"],
  input[type="text"],
  input[type="number"] {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 11px 12px;
    font-size: 14px;
    font-family: var(--sans);
    color: var(--text);
  }
  input[type="password"]:focus,
  input[type="text"]:focus,
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type="password"]:disabled,
  input[type="text"]:disabled,
  input[type="number"]:disabled { opacity: .5; }

  .region-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .region-row input { flex: 1 1 90px; min-width: 70px; width: auto; }
  .region-row .head-btn { padding: 8px 12px; flex: none; }
  .region-row .head-btn:disabled { opacity: .5; cursor: not-allowed; }

  #pv-dialog {
    padding: 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    max-width: none;
  }
  #pv-dialog::backdrop { background: rgba(31, 31, 28, .5); }
  .pv-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }
  .pv-nav, .pv-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pv-canvas-wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    overflow: hidden;
  }
  #pv-canvas {
    display: block;
    max-width: 100%;
    height: auto;
    cursor: crosshair;
    touch-action: none;
  }
  .pv-select {
    position: absolute;
    border: 1.5px solid var(--accent);
    background: rgba(47, 111, 106, .15);
    pointer-events: none;
  }
  .pv-page {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .pv-hint {
    font-size: 12px;
    color: var(--muted);
  }
  .pv-error {
    margin-bottom: 10px;
    padding: 8px 10px;
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    color: var(--danger);
    font-size: 13px;
  }

  .radios {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .radio-card {
    position: relative;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 12px 10px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: border-color .12s, background .12s;
  }
  .radio-card input { position: absolute; opacity: 0; pointer-events: none; }
  .radio-card span {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .radio-card:hover { border-color: var(--accent); }
  .radio-card:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .radio-card:has(input:checked) span { color: var(--accent); }
  .radio-card:has(input:focus-visible) {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .radio-card:has(input:disabled) {
    opacity: .5;
    pointer-events: none;
  }

  .run-btn {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-family: var(--sans);
    padding: 13px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .run-btn:hover:enabled { background: #275c58; }
  .run-btn:disabled { opacity: .5; cursor: not-allowed; }

  .error {
    margin-top: 10px;
    font-size: 12px;
    color: var(--danger);
  }

  .output-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .output-head .field-label { margin-bottom: 0; }
  .output-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .head-btn, .tabbar button, #table-picker {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .head-btn:hover, .tabbar button:hover { color: var(--accent); border-color: var(--accent); }
  #table-picker { max-width: 260px; }
  .tabbar { display: flex; gap: 4px; }
  .tabbar button.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .output {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 14px;
    max-height: 65vh;
    overflow: auto;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    margin: 0;
  }

  .table-scroll {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--panel);
    max-height: 65vh;
    overflow: auto;
  }
  table.result {
    border-collapse: collapse;
    font-size: 13px;
  }
  table.result td {
    border: 1px solid var(--border-strong);
    padding: .3rem .5rem;
    vertical-align: top;
    text-align: left;
    white-space: pre-wrap;
  }

  iframe.preview {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: #fff;
    width: 100%;
    height: 65vh;
  }
</style>
</head>
<body>
  <div class="wrap">

    <header class="page-head">
      <h1 class="page-title">pdfni demo</h1>
      <a class="gh-link" href="https://github.com/honononta-2/pdfni" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </header>

    <div class="field">
      <span class="field-label">PDF File</span>
      <div class="dropzone disabled" id="dropzone">
        <div id="dz-empty">Drop a PDF here or click to browse</div>
        <div class="dz-file" id="dz-file" hidden>
          <div>
            <div class="file-name" id="file-name"></div>
            <div class="file-size" id="file-size"></div>
          </div>
          <button type="button" class="remove-btn" id="remove">Remove</button>
        </div>
      </div>
      <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" autocomplete="off" disabled>
    </div>

    <div class="field">
      <label class="field-label" for="pages">Pages</label>
      <input type="text" id="pages" placeholder="1,3-5,7" autocomplete="off" disabled>
    </div>

    <div class="field">
      <span class="field-label">Region</span>
      <div class="region-row">
        <input type="number" id="rg-left" placeholder="left" step="any" disabled>
        <input type="number" id="rg-top" placeholder="top" step="any" disabled>
        <input type="number" id="rg-right" placeholder="right" step="any" disabled>
        <input type="number" id="rg-bottom" placeholder="bottom" step="any" disabled>
        <button type="button" class="head-btn" id="preview-btn" disabled>Select on preview</button>
      </div>
    </div>

    <dialog id="pv-dialog">
      <div class="pv-head">
        <div class="pv-nav">
          <button type="button" class="head-btn" id="pv-prev">&#8592;</button>
          <span class="pv-page" id="pv-page"></span>
          <button type="button" class="head-btn" id="pv-next">&#8594;</button>
        </div>
        <span class="pv-hint">Drag on the page to select a region</span>
        <div class="pv-actions">
          <button type="button" class="head-btn" id="pv-apply">Apply</button>
          <button type="button" class="head-btn" id="pv-cancel">Cancel</button>
        </div>
      </div>
      <div class="pv-error" id="pv-error" hidden></div>
      <div class="pv-canvas-wrap">
        <canvas id="pv-canvas"></canvas>
        <div class="pv-select" id="pv-select" hidden></div>
      </div>
    </dialog>

    <div class="field">
      <span class="field-label">Output Mode</span>
      <div class="radios">
        <label class="radio-card">
          <input type="radio" name="mode" value="reader" checked disabled>
          <span>Reader</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="mode" value="tables" disabled>
          <span>Tables</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="mode" value="doc" disabled>
          <span>Doc</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="mode" value="md" disabled>
          <span>Markdown</span>
        </label>
      </div>
    </div>

    <div class="field">
      <button class="run-btn" id="run" disabled>Run</button>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="field" id="output-field" hidden>
      <div class="output-head">
        <span class="field-label">Output</span>
        <div class="output-controls">
          <select id="table-picker" hidden></select>
          <div class="tabbar" id="tabs" hidden>
            <button type="button" data-tab="preview">Preview</button>
            <button type="button" data-tab="raw">Raw</button>
          </div>
          <button type="button" class="head-btn" id="csv" hidden>Download CSV</button>
          <button type="button" class="head-btn" id="copy" hidden>Copy</button>
        </div>
      </div>
      <pre class="output" id="text-out" hidden></pre>
      <div class="table-scroll" id="table-out" hidden></div>
      <iframe class="preview" id="md-preview" sandbox referrerpolicy="no-referrer" title="markdown preview" hidden></iframe>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const dropzone = $('dropzone');
const fileInput = $('file-input');
const runBtn = $('run');
const errorEl = $('error');

const controls = { tabs: $('tabs'), picker: $('table-picker'), csv: $('csv'), copy: $('copy') };
const panes = { text: $('text-out'), table: $('table-out'), preview: $('md-preview') };

let wasm = null;
let wasmReady = false;
let currentFile = null;
const results = { reader: null, tables: null, doc: null, md: null };
const activeTab = { tables: 'preview', md: 'preview' };

const PDFJS_ROOT = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38';
const pvState = { lib: null, doc: null, pageNum: 1, base: null, drag: null, sel: null };
const pvCanvas = $('pv-canvas');
const pvDialog = $('pv-dialog');

try {
  wasm = await import('./pkg/pdfni.js');
  await wasm.default();
  dropzone.classList.remove('disabled');
  $('password').disabled = false;
  document.querySelectorAll('input[name=mode]').forEach((r) => { r.disabled = false; });
  wasmReady = true;
  updateFilterState();
} catch (e) {
  showError('Failed to load wasm: ' + (e?.message ?? e));
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.hidden = false;
}

function clearError() {
  errorEl.textContent = '';
  errorEl.hidden = true;
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function acceptFile(file) {
  if (!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf) {
    showError('Not a PDF file.');
    return;
  }
  clearError();
  currentFile = file;
  $('file-name').textContent = file.name;
  $('file-size').textContent = fmtSize(file.size);
  $('dz-empty').hidden = true;
  $('dz-file').hidden = false;
  dropzone.classList.add('has-file');
  runBtn.disabled = false;
  updateFilterState();
}

function clearFile() {
  currentFile = null;
  fileInput.value = '';
  $('dz-empty').hidden = false;
  $('dz-file').hidden = true;
  dropzone.classList.remove('has-file');
  runBtn.disabled = true;
  updateFilterState();
}

dropzone.addEventListener('click', () => {
  if (!currentFile) fileInput.click();
});
fileInput.addEventListener('change', () => acceptFile(fileInput.files[0]));
$('remove').addEventListener('click', (e) => {
  e.stopPropagation();
  clearFile();
});

['dragover', 'dragenter'].forEach((ev) => {
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'dragend', 'drop'].forEach((ev) => {
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => acceptFile(e.dataTransfer.files[0]));

function updateFilterState() {
  const on = wasmReady;
  $('pages').disabled = !on;
  for (const id of ['rg-left', 'rg-top', 'rg-right', 'rg-bottom']) $(id).disabled = !on;
  $('preview-btn').disabled = !on || !currentFile;
  if (!on || !currentFile) closePreview();
}

function filterOptionsJson() {
  const opts = {};
  const pages = $('pages').value.trim();
  if (pages) opts.pages = pages;
  const vals = ['rg-left', 'rg-top', 'rg-right', 'rg-bottom'].map((id) => $(id).value.trim());
  if (vals.every((v) => v !== '')) {
    const [left, top, right, bottom] = vals.map(Number);
    opts.region = { left, top, right, bottom };
  } else if (vals.some((v) => v !== '')) {
    throw new Error('Region needs all of left, top, right, bottom.');
  }
  return Object.keys(opts).length ? JSON.stringify(opts) : undefined;
}

$('preview-btn').addEventListener('click', () => { openPreview(); });
$('pv-cancel').addEventListener('click', () => pvDialog.close());
$('pv-apply').addEventListener('click', () => {
  if (pvState.sel) {
    const round = (v) => Math.round(v * 100) / 100;
    $('rg-left').value = round(pvState.sel.left);
    $('rg-top').value = round(pvState.sel.top);
    $('rg-right').value = round(pvState.sel.right);
    $('rg-bottom').value = round(pvState.sel.bottom);
  }
  pvDialog.close();
});
$('pv-prev').addEventListener('click', () => {
  showPreviewPage(pvState.pageNum - 1).catch(showPreviewError);
});
$('pv-next').addEventListener('click', () => {
  showPreviewPage(pvState.pageNum + 1).catch(showPreviewError);
});
pvDialog.addEventListener('close', () => {
  pvState.doc?.destroy();
  pvState.doc = null;
  pvState.drag = null;
});

function showPreviewError(e) {
  if (!pvDialog.open) return;
  const el = $('pv-error');
  el.textContent = 'Preview failed: ' + (e?.message ?? e);
  el.hidden = false;
}

async function openPreview() {
  if (!currentFile) return;
  pvDialog.showModal();
  $('pv-error').hidden = true;
  $('pv-page').textContent = '';
  $('pv-select').hidden = true;
  try {
    if (!pvState.lib) {
      pvState.lib = await import(`${PDFJS_ROOT}/build/pdf.min.mjs`);
      pvState.lib.GlobalWorkerOptions.workerSrc = `${PDFJS_ROOT}/build/pdf.worker.min.mjs`;
    }
    const bytes = new Uint8Array(await currentFile.arrayBuffer());
    const password = $('password').value || undefined;
    // cMapUrl / standardFontDataUrl are required to draw text of CID-font PDFs
    const doc = await pvState.lib.getDocument({
      data: bytes,
      password,
      cMapUrl: `${PDFJS_ROOT}/cmaps/`,
      cMapPacked: true,
      standardFontDataUrl: `${PDFJS_ROOT}/standard_fonts/`,
    }).promise;
    if (!pvDialog.open) {
      doc.destroy();
      return;
    }
    pvState.doc = doc;
    pvState.sel = selFromInputs();
    await showPreviewPage(1);
  } catch (e) {
    showPreviewError(e);
  }
}

async function showPreviewPage(n) {
  if (!pvState.doc) return;
  const num = Math.min(Math.max(n, 1), pvState.doc.numPages);
  pvState.pageNum = num;
  const page = await pvState.doc.getPage(num);
  const base = page.getViewport({ scale: 1 });
  pvState.base = { width: base.width, height: base.height };
  const maxW = Math.max(window.innerWidth * 0.9 - 32, 280);
  const maxH = Math.max(window.innerHeight * 0.85 - 80, 280);
  const scale = Math.min(maxW / base.width, maxH / base.height);
  const dpr = window.devicePixelRatio || 1;
  const viewport = page.getViewport({ scale });
  pvCanvas.width = Math.floor(viewport.width * dpr);
  pvCanvas.height = Math.floor(viewport.height * dpr);
  pvCanvas.style.width = `${Math.floor(viewport.width)}px`;
  pvCanvas.style.height = `${Math.floor(viewport.height)}px`;
  const ctx = pvCanvas.getContext('2d');
  await page.render({
    canvasContext: ctx,
    viewport,
    transform: dpr === 1 ? undefined : [dpr, 0, 0, dpr, 0, 0],
  }).promise;
  $('pv-page').textContent = `${num} / ${pvState.doc.numPages}`;
  drawSelection();
}

function closePreview() {
  if (pvDialog.open) pvDialog.close();
}

// Region inputs -> initial selection, in PDF points (top-left origin)
function selFromInputs() {
  const vals = ['rg-left', 'rg-top', 'rg-right', 'rg-bottom'].map((id) => $(id).value.trim());
  if (vals.some((v) => v === '')) return null;
  const [left, top, right, bottom] = vals.map(Number);
  if (![left, top, right, bottom].every(Number.isFinite)) return null;
  if (right <= left || bottom <= top) return null;
  return { left, top, right, bottom };
}

function toPagePoint(e) {
  const rect = pvCanvas.getBoundingClientRect();
  const clamp = (v, hi) => Math.min(Math.max(v, 0), hi);
  return {
    x: clamp(e.clientX - rect.left, rect.width) * (pvState.base.width / rect.width),
    y: clamp(e.clientY - rect.top, rect.height) * (pvState.base.height / rect.height),
  };
}

pvCanvas.addEventListener('pointerdown', (e) => {
  if (!pvState.doc) return;
  e.preventDefault();
  pvCanvas.setPointerCapture(e.pointerId);
  pvState.drag = toPagePoint(e);
  dragTo(e);
});
pvCanvas.addEventListener('pointermove', (e) => {
  if (pvState.drag) dragTo(e);
});
pvCanvas.addEventListener('pointerup', (e) => {
  if (!pvState.drag) return;
  dragTo(e);
  // treat a tiny drag as a click that clears the selection
  const s = pvState.sel;
  if (s && (s.right - s.left < 2 || s.bottom - s.top < 2)) pvState.sel = null;
  pvState.drag = null;
  drawSelection();
});

function dragTo(e) {
  const p = toPagePoint(e);
  const d = pvState.drag;
  pvState.sel = {
    left: Math.min(d.x, p.x),
    top: Math.min(d.y, p.y),
    right: Math.max(d.x, p.x),
    bottom: Math.max(d.y, p.y),
  };
  drawSelection();
}

// Draw the current selection over the canvas, clipped to the shown page
function drawSelection() {
  const box = $('pv-select');
  const sel = pvState.sel;
  if (!sel || !pvState.base) {
    box.hidden = true;
    return;
  }
  const rect = pvCanvas.getBoundingClientRect();
  const sx = rect.width / pvState.base.width;
  const sy = rect.height / pvState.base.height;
  const left = Math.max(sel.left, 0) * sx;
  const top = Math.max(sel.top, 0) * sy;
  const right = Math.min(sel.right, pvState.base.width) * sx;
  const bottom = Math.min(sel.bottom, pvState.base.height) * sy;
  if (right <= left || bottom <= top) {
    box.hidden = true;
    return;
  }
  box.style.left = `${left}px`;
  box.style.top = `${top}px`;
  box.style.width = `${right - left}px`;
  box.style.height = `${bottom - top}px`;
  box.hidden = false;
}

runBtn.addEventListener('click', run);

function currentMode() {
  return document.querySelector('input[name=mode]:checked').value;
}

document.querySelectorAll('input[name=mode]').forEach((r) => {
  r.addEventListener('change', () => {
    updateFilterState();
    render();
  });
});

async function run() {
  if (!currentFile || !wasm) return;
  clearError();
  runBtn.disabled = true;
  await nextPaint();
  const mode = currentMode();
  try {
    const bytes = new Uint8Array(await currentFile.arrayBuffer());
    const password = $('password').value || undefined;
    const optionsJson = filterOptionsJson();
    if (mode === 'reader') {
      results.reader = { text: pretty(wasm.extract_text_from_pdf(bytes, password, optionsJson)) };
    } else if (mode === 'doc') {
      results.doc = { text: pretty(wasm.extract_document_from_pdf(bytes, optionsJson, password)) };
    } else if (mode === 'tables') {
      const json = wasm.extract_tables_from_pdf(bytes, optionsJson, password);
      results.tables = { json: pretty(json), tables: collectTables(JSON.parse(json)) };
      buildPicker(results.tables.tables);
    } else {
      const md = wasm.extract_markdown_from_pdf(bytes, optionsJson, password);
      results.md = { text: md };
      renderMarkdownPreview(md);
    }
    render();
  } catch (e) {
    showError('Failed: ' + (e?.message ?? e));
  } finally {
    runBtn.disabled = !currentFile;
  }
}

function nextPaint() {
  return new Promise((resolve) => {
    requestAnimationFrame(() => setTimeout(resolve, 0));
  });
}

function pretty(jsonStr) {
  try { return JSON.stringify(JSON.parse(jsonStr), null, 2); }
  catch { return jsonStr; }
}

function render() {
  const mode = currentMode();
  const res = results[mode];
  if (!res) {
    $('output-field').hidden = true;
    return;
  }
  $('output-field').hidden = false;
  if (mode === 'reader' || mode === 'doc') {
    panes.text.textContent = res.text;
    setOutput({ text: true, copy: true });
    return;
  }
  if (mode === 'md') {
    setTabs(activeTab.md);
    if (activeTab.md === 'preview') {
      setOutput({ tabs: true, preview: true, copy: true });
    } else {
      panes.text.textContent = res.text;
      setOutput({ tabs: true, text: true, copy: true });
    }
    return;
  }
  if (res.tables.length === 0) {
    panes.text.textContent = 'No tables detected';
    setOutput({ text: true });
    return;
  }
  setTabs(activeTab.tables);
  if (activeTab.tables === 'preview') {
    renderSelectedTable();
    setOutput({ tabs: true, picker: true, table: true, csv: true });
  } else {
    panes.text.textContent = res.json;
    setOutput({ tabs: true, text: true, copy: true });
  }
}

function setOutput(show) {
  controls.tabs.hidden = !show.tabs;
  controls.picker.hidden = !show.picker;
  controls.csv.hidden = !show.csv;
  controls.copy.hidden = !show.copy;
  panes.text.hidden = !show.text;
  panes.table.hidden = !show.table;
  panes.preview.hidden = !show.preview;
}

function setTabs(active) {
  controls.tabs.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('active', b.dataset.tab === active);
  });
}

controls.tabs.querySelectorAll('button').forEach((b) => {
  b.addEventListener('click', () => {
    activeTab[currentMode()] = b.dataset.tab;
    render();
  });
});

const PREVIEW_CSS = `
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1rem 1.25rem; color: #1f1f1c; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #aaa; padding: .2rem .5rem; }
  pre { background: #f5f5f5; padding: .5rem; overflow: auto; }
  code { background: #f5f5f5; padding: 0 .2rem; border-radius: 2px; }
  img { max-width: 100%; }
`;

function renderMarkdownPreview(md) {
  const body = window.marked
    ? window.marked.parse(md)
    : `<pre>${escapeHtml(md)}</pre>`;
  panes.preview.srcdoc =
    `<!doctype html><meta charset="utf-8"><style>${PREVIEW_CSS}</style>${body}`;
}

function collectTables(doc) {
  const tables = [];
  for (const p of doc.pages ?? []) {
    let idx = 0;
    for (const t of p.tables ?? []) {
      tables.push({
        page: p.index,
        index: idx,
        method: t.extraction_method ?? '?',
        rows: t.n_rows ?? (t.data?.length ?? 0),
        cols: t.n_cols ?? (t.data?.[0]?.length ?? 0),
        cells: (t.data ?? []).map((row) => row.map((c) => c?.text ?? '')),
      });
      idx++;
    }
  }
  return tables;
}

function buildPicker(tables) {
  const picker = controls.picker;
  picker.innerHTML = '';
  tables.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `p${t.page} #${t.index} — ${t.rows}×${t.cols} (${t.method})`;
    picker.appendChild(opt);
  });
  picker.value = '0';
}

function currentTable() {
  return results.tables?.tables[Number(controls.picker.value)] ?? null;
}

function renderSelectedTable() {
  const t = currentTable();
  if (!t) return;
  const rows = t.cells.map((row) =>
    '<tr>' + row.map((c) => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>'
  ).join('');
  panes.table.innerHTML = `<table class="result"><tbody>${rows}</tbody></table>`;
}

controls.picker.addEventListener('change', renderSelectedTable);

controls.csv.addEventListener('click', () => {
  const t = currentTable();
  if (!t) return;
  const csv = t.cells.map((row) => row.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `page${t.page}_table${t.index}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

function csvCell(s) {
  const v = String(s ?? '');
  return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

function copySource() {
  const res = results[currentMode()];
  if (!res) return '';
  return res.json ?? res.text ?? '';
}

function copyText(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    ok ? resolve() : reject(new Error('copy failed'));
  });
}

let copyTimer = 0;
function flashCopy(label) {
  controls.copy.textContent = label;
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { controls.copy.textContent = 'Copy'; }, 1200);
}

controls.copy.addEventListener('click', () => {
  copyText(copySource()).then(
    () => flashCopy('Copied'),
    () => flashCopy('Copy failed'),
  );
});
</script>
</body>
