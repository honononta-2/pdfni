name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'src/**'
      - 'data/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Rust & Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build WebAssembly package
        run: wasm-pack build --release --target web --out-dir _wasm_pkg --features markdown

      - name: Assemble static site
        run: |
          mkdir -p _site/demo/pkg
          cp site/index.html site/sitemap.xml _site/
          cp site/demo/index.html _site/demo/
          cp _wasm_pkg/pdfni.js _wasm_pkg/pdfni_bg.wasm _site/demo/pkg/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
