[package]
name = "reticella"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Extract tables and Markdown from text-embedded PDFs, with a built-in pure-Rust PDF reader adapted from Mozilla pdf.js."
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "reticella"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "reticella"
path = "src/bin/main.rs"
required-features = ["reader"]

[[example]]
name = "reader_smoke"
required-features = ["reader"]

[[example]]
name = "reader_probe"
required-features = ["reader"]

[[example]]
name = "text_probe"
required-features = ["document"]

[features]
default = [
    "document",
    "cmap-gb1", "cmap-cns1", "cmap-japan1", "cmap-korea1",
]

# Text views: coordinate-tagged chars, lines, and words
text = []

# PDF byte input: parse bytes into page parts and TextDoc
reader = [
    "text",
    "dep:flate2", "dep:aes", "dep:cbc", "dep:md-5", "dep:sha2",
]

# Document model and Markdown output
document = ["reader"]

# Predefined CMap groups; effective only when `reader` is enabled
cmap-gb1    = []
cmap-cns1   = []
cmap-japan1 = []
cmap-korea1 = []

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# FlateDecode 用。既定バックエンドは純Rustのため wasm32 でもビルド可能
flate2 = { version = "1", optional = true }
# PDF Standard セキュリティハンドラ用（reader のみ）
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }

# wasm から JS へ公開する入口用
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
