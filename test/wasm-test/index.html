<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>reticella browser test</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 900px; }
    h1 { font-size: 1.3rem; }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
    h2 { font-size: 1.05rem; margin-top: 0; }
    pre { background: #f4f4f4; padding: .75rem; overflow: auto; max-height: 420px; font-size: 12px; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    button { padding: .4rem .8rem; }
    .note { color: #666; font-size: 13px; }
    .err { color: #b00; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>reticella browser test</h1>

  <section>
    <h2>reader route (pure Rust wasm)</h2>
    <div class="row">
      <input type="file" id="pdf1" accept="application/pdf">
      <button id="run1">Extract</button>
      <span id="status1" class="note"></span>
    </div>
    <pre id="out1"></pre>
  </section>

  <script type="module">
    import init, { extract_tables_from_pdf } from './pkg/reticella.js';

    function fmt(doc) {
      const summary = doc.pages.map(p =>
        `p${p.page_number}: ` + (p.tables.map(t => `${t.extraction_method} ${t.n_rows}x${t.n_cols}`).join(', ') || '(no tables)')
      ).join('\n');
      return summary + '\n\n' + JSON.stringify(doc, null, 2);
    }
    const bytes = (f) => f.arrayBuffer().then(b => new Uint8Array(b));

    await init();
    document.getElementById('run1').onclick = async () => {
      const f = document.getElementById('pdf1').files[0];
      const s = document.getElementById('status1'), out = document.getElementById('out1');
      if (!f) { s.textContent = 'Choose a PDF first'; return; }
      s.textContent = 'Working...'; out.textContent = ''; out.className = '';
      try {
        const doc = JSON.parse(extract_tables_from_pdf(await bytes(f), undefined, undefined));
        out.textContent = fmt(doc); s.textContent = 'Done';
      } catch (e) { out.className = 'err'; out.textContent = String(e && e.stack || e); s.textContent = 'Failed'; }
    };

    document.getElementById('status1').textContent = 'Ready';
  </script>
</body>
</html>
